name: Update Next.js security patch

on:
  push:
    branches:
      - design/dark-violet-refinement
    paths:
      - .github/workflows/update-next-security.yml

permissions:
  contents: write

jobs:
  update-next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/dark-violet-refinement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update patched Next.js packages
        run: npm install next@16.3.3 eslint-config-next@16.3.3 --save-exact
      - name: Verify dependency audit
        run: npm audit --audit-level=high
      - name: Commit regenerated dependency lock
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: update Next.js security patch"
          git push origin HEAD:design/dark-violet-refinement
